name: Generate contribution snake

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution images are unchanged.'
          else
            git commit -m 'Update contribution snake'
            git push origin HEAD:main
          fi
